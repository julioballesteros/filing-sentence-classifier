[project]
name = "filing-sentence-classifier"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Julio Ballesteros", email = "ballesterosg.julio@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
filing-sentence-classifier = "filing_sentence_classifier:main"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src"]

[tool.ruff.lint]
# Python errors, unused code, import sorting, modern syntax, and common bugs.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers", "-ra"]

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "pytest",
    "ruff",
]
