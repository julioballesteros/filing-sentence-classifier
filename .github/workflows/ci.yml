name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FSC_REQUIRE_WHEEL: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install

      - name: Install development and runtime dependencies
        run: uv sync --locked --dev --extra data --extra train --extra tracking --no-install-project

      - name: Build and install the delivery wheel
        run: |
          uv build --wheel
          uv pip install --no-deps --reinstall dist/*.whl

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Check types
        run: uv run --no-sync mypy

      - name: Run standard tests
        run: uv run --no-sync pytest

      - name: Run training checks
        run: uv run --no-sync pytest -m training
