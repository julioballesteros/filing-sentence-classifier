# Use the project's locked tools instead of maintaining separate hook environments.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked --extra data ruff check --fix
        language: system
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked --extra data ruff format
        language: system
        types_or: [python, pyi, jupyter]
      - id: mypy
        name: mypy
        entry: uv run --locked --extra data mypy
        language: system
        files: ^(src/.*\.pyi?|pyproject\.toml|uv\.lock)$
        pass_filenames: false
